
services:
  postgres:
    image: postgres:17
    container_name: oss-atlas-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: oss_atlas
      POSTGRES_USER: oss_atlas
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - oss_atlas_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oss_atlas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  oss_atlas_data:
