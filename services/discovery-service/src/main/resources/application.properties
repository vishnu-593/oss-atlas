spring.application.name=discovery-service
server.port=8082

# PostgreSQL connection (shared DB; Discovery owns only refresh_cursors table)
spring.datasource.url=jdbc:postgresql://localhost:5432/oss_atlas
spring.datasource.username=oss_atlas
spring.datasource.password=local_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway — separate history table so it doesn't conflict with catalogue-service migrations
spring.flyway.table=discovery_flyway_schema_history

# Downstream service URLs (override with env vars in other environments)
oss-atlas.catalogue.base-url=${CATALOGUE_SERVICE_URL:http://localhost:8081}

# Direct GitHub API (unauthenticated by default — set GITHUB_TOKEN to raise rate limits)
oss-atlas.github.base-url=https://api.github.com
oss-atlas.github.token=${GITHUB_TOKEN:}

# Scheduled refresh job
oss-atlas.refresh.enabled=true
oss-atlas.refresh.cron=0 0 23 * * *
oss-atlas.refresh.zone=Asia/Kolkata
oss-atlas.refresh.page-size=50

# 9 seed queries — each fetches 100 results per trigger, advances page on next trigger
# 9 requests/minute stays within GitHub's unauthenticated limit of 10/minute
oss-atlas.refresh.queries[0].query=developer tools
oss-atlas.refresh.queries[0].min-stars=1000
oss-atlas.refresh.queries[0].limit=100

oss-atlas.refresh.queries[1].query=machine learning framework
oss-atlas.refresh.queries[1].language=Python
oss-atlas.refresh.queries[1].min-stars=2000
oss-atlas.refresh.queries[1].limit=100

oss-atlas.refresh.queries[2].query=web framework
oss-atlas.refresh.queries[2].min-stars=1000
oss-atlas.refresh.queries[2].limit=100

oss-atlas.refresh.queries[3].query=database
oss-atlas.refresh.queries[3].min-stars=500
oss-atlas.refresh.queries[3].limit=100

oss-atlas.refresh.queries[4].query=devops infrastructure
oss-atlas.refresh.queries[4].min-stars=500
oss-atlas.refresh.queries[4].limit=100

oss-atlas.refresh.queries[5].query=security authentication
oss-atlas.refresh.queries[5].min-stars=500
oss-atlas.refresh.queries[5].limit=100

oss-atlas.refresh.queries[6].query=api backend
oss-atlas.refresh.queries[6].min-stars=500
oss-atlas.refresh.queries[6].limit=100

oss-atlas.refresh.queries[7].query=monitoring observability
oss-atlas.refresh.queries[7].min-stars=500
oss-atlas.refresh.queries[7].limit=100

oss-atlas.refresh.queries[8].query=cli tools
oss-atlas.refresh.queries[8].min-stars=500
oss-atlas.refresh.queries[8].limit=100
