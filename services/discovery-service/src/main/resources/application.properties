spring.application.name=discovery-service
server.port=8082

# No database — this service only orchestrates calls to other services
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# Downstream service URLs (override with env vars in other environments)
oss-atlas.catalogue.base-url=${CATALOGUE_SERVICE_URL:http://localhost:8081}

# Direct GitHub API (used by SearchService; unauthenticated by default — set GITHUB_TOKEN to raise rate limits)
oss-atlas.github.base-url=https://api.github.com
oss-atlas.github.token=${GITHUB_TOKEN:}

# Scheduled refresh job
oss-atlas.refresh.enabled=true
oss-atlas.refresh.cron=0 0 23 * * *
oss-atlas.refresh.zone=Asia/Kolkata
oss-atlas.refresh.page-size=50

# Default seed queries — runs on POST /api/discovery/admin/refresh or nightly cron
oss-atlas.refresh.queries[0].query=developer tools
oss-atlas.refresh.queries[0].min-stars=1000
oss-atlas.refresh.queries[0].limit=10

oss-atlas.refresh.queries[1].query=machine learning framework
oss-atlas.refresh.queries[1].language=Python
oss-atlas.refresh.queries[1].min-stars=2000
oss-atlas.refresh.queries[1].limit=10

oss-atlas.refresh.queries[2].query=web framework
oss-atlas.refresh.queries[2].min-stars=1000
oss-atlas.refresh.queries[2].limit=10

oss-atlas.refresh.queries[3].query=database
oss-atlas.refresh.queries[3].min-stars=500
oss-atlas.refresh.queries[3].limit=10

oss-atlas.refresh.queries[4].query=devops infrastructure
oss-atlas.refresh.queries[4].min-stars=500
oss-atlas.refresh.queries[4].limit=10
