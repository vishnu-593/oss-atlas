name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog-fragment:
    name: Changelog Fragment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changelog fragment exists
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          FOUND=$(ls changelog/${PR_NUMBER}.*.md 2>/dev/null | wc -l)
          if [ "$FOUND" -eq 0 ]; then
            echo "❌ No changelog fragment found."
            echo "   Create changelog/${PR_NUMBER}.<type>.md with one line describing your change."
            echo "   Types: feat, fix, docs, test, chore"
            exit 1
          fi
          echo "✅ Changelog fragment found:"
          cat changelog/${PR_NUMBER}.*.md

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalogue-service, discovery-service, source-integration-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw -B test
